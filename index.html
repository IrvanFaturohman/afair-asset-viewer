<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A FAIR Asset Viewer</title>
<meta name="description" content="Katalog 3D interaktif Nusantara Kit dari A FAIR Studio: aset game-ready dengan LOD, collision, dan material PBR.">
<style>
  :root{
    --bg1:#3b1f60; --bg2:#170c27;
    --panel:rgba(43,22,72,.84); --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.1);
    --text:#f3eefb; --muted:#b4a6cc; --accent:#fbb01c; --ink:#1d1030;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(ellipse 80% 70% at 50% 38%,var(--bg1),var(--bg2));}
  canvas{display:block;position:fixed;inset:0;touch-action:none}
  .panel{position:fixed;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:14px}
  h1{font-size:15px;margin:0;letter-spacing:.02em}
  h2{font-size:11px;margin:0 0 8px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;font-weight:700}

  /* left: brand + catalog */
  #side{top:16px;left:16px;bottom:16px;width:262px;display:flex;flex-direction:column;padding:12px}
  #brand{display:flex;gap:10px;align-items:center;padding:2px 2px 12px;border-bottom:1px solid var(--line)}
  #brand svg{width:36px;height:36px;flex:none}
  #brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  #chips{display:flex;flex-wrap:wrap;gap:5px;padding:10px 0}
  #chips button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:20px;padding:4px 9px;font:inherit;font-size:11px;cursor:pointer}
  #chips button.on{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
  #list{flex:1;overflow:auto;margin:0 -4px;padding:0 4px}
  #list h2{margin:10px 0 4px} #list h2:first-child{margin-top:2px}
  #list button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;background:none;border:1px solid transparent;color:var(--text);padding:5px 7px;border-radius:9px;cursor:pointer;font:inherit;font-size:13px}
  #list button:hover{background:var(--card)}
  #list button.on{background:rgba(251,176,28,.14);border-color:rgba(251,176,28,.55)}
  #list button span.c{display:block;font-size:10.5px;color:var(--muted)}
  #list .ico{width:26px;height:26px;flex:none;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:13px}

  /* right: controls + stats */
  #controls{top:16px;right:16px;width:250px}
  .seg{display:flex;background:rgba(0,0,0,.25);border-radius:9px;padding:3px;gap:3px;margin-bottom:12px}
  .seg button{flex:1;background:none;border:0;color:var(--muted);padding:6px 4px;border-radius:7px;cursor:pointer;font:inherit;font-size:12px}
  .seg button.on{background:var(--accent);color:var(--ink);font-weight:700}
  .swatches{display:flex;gap:8px;margin-bottom:10px}
  .swatches button{flex:1;border:2px solid transparent;border-radius:9px;padding:0;cursor:pointer;background:none;color:var(--muted);font:inherit;font-size:10.5px}
  .swatches button .sw{height:22px;border-radius:7px;margin-bottom:3px}
  .swatches button.on{border-color:var(--accent);color:var(--text)}
  .toggle{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;cursor:pointer;user-select:none}
  .toggle i{width:34px;height:20px;border-radius:10px;background:rgba(255,255,255,.15);position:relative;transition:.2s}
  .toggle i::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
  .toggle.on i{background:var(--accent)} .toggle.on i::after{left:17px}
  .btn{width:100%;margin-top:8px;padding:8px;border-radius:9px;border:0;background:var(--accent);color:var(--ink);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  #stats{right:16px;bottom:16px;width:250px}
  #stats .name{font-size:16px;font-weight:700;margin:0}
  #stats .cat{color:var(--muted);font-size:12px;margin:2px 0 4px}
  #stats code{display:inline-block;font:11px ui-monospace,Menlo,monospace;color:var(--accent);background:rgba(0,0,0,.25);padding:2px 6px;border-radius:5px;margin-bottom:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #stats .desc{font-size:12px;color:#d9cfe9;line-height:1.45;margin:0 0 10px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
  .grid4 div{background:rgba(0,0,0,.25);border-radius:8px;padding:6px 4px;text-align:center}
  .grid4 b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
  .grid4 span{font-size:9.5px;color:var(--muted)}
  .lodrow{display:grid;grid-template-columns:36px 1fr 50px;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin:3px 0;font-variant-numeric:tabular-nums}
  .lodrow .bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
  .lodrow .bar i{display:block;height:100%;background:#8c79ad;border-radius:3px;transition:width .3s}
  .lodrow.on{color:var(--text)} .lodrow.on .bar i{background:var(--accent)}
  .lodrow em{font-style:normal;text-align:right}

  /* top title + bottom bar */
  #title{position:fixed;top:18px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
  #title b{display:block;font-size:22px;letter-spacing:.01em;text-shadow:0 2px 12px rgba(0,0,0,.4)}
  #title span{font-size:12px;color:var(--muted)}
  #title em{font-style:normal;color:var(--accent);font-weight:700}
  #bar{left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px}
  #bar button{border:0;background:rgba(255,255,255,.08);color:var(--text);border-radius:8px;height:34px;min-width:34px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer}
  #bar button:hover{background:rgba(255,255,255,.16)}
  #bar button.on{background:var(--accent);color:var(--ink);font-weight:700}
  #bar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  #bar .tier{font-size:12px;color:var(--muted);padding:0 6px;white-space:nowrap}
  #bar .tier b{color:var(--accent)}
  #tourbar{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0}
  kbd{font:inherit;font-size:10px;padding:1px 5px;border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,.05)}
  .hint{font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.6}

  @media (max-width:1280px){ #bar .tier,#bar .sep.t{display:none} }
  @media (max-width:1080px){ #title{display:none} }
  @media (max-height:740px){ #stats .desc,#controls .hint{display:none} }
  @media (max-width:760px){
    #side{top:10px;left:10px;right:10px;bottom:auto;width:auto;padding:8px}
    #brand{padding-bottom:6px} #brand small{display:none}
    #chips{flex-wrap:nowrap;overflow-x:auto;padding:6px 0}
    #chips button{flex:none}
    #list{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;flex:none}
    #list h2{display:none}
    #list button{width:auto;flex:none;white-space:nowrap}
    #list button span.c{display:none}
    #controls{top:auto;bottom:62px;right:10px;left:10px;width:auto;padding:10px;max-height:30vh;overflow:auto}
    #stats{display:none}
    #bar{bottom:10px}
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="side" class="panel">
  <div id="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <rect width="40" height="40" rx="9" fill="#7438b0"/>
      <path d="M14 10l3 3 3-5 3 5 3-3-1.5 6h-9z" fill="#fbb01c"/>
      <text x="20" y="30" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="14" font-style="italic" fill="#fff" stroke="#2a1442" stroke-width=".8">AFAIR</text>
    </svg>
    <div><h1>A FAIR Studio</h1><small id="count">Nusantara Kit</small></div>
  </div>
  <div id="chips"></div>
  <div id="list"></div>
</div>

<div id="title"><b id="tName"></b><span id="tSub"></span></div>

<div id="controls" class="panel">
  <h2>Tampilan</h2>
  <div class="seg" id="mode"></div>
  <h2>Level of Detail</h2>
  <div class="seg" id="lod"></div>
  <h2>Varian Warna</h2>
  <div class="swatches" id="variants"></div>
  <div class="toggle" id="tCol">Collision mesh <i></i></div>
  <div class="toggle on" id="tTurn">Turntable <i></i></div>
  <button class="btn" id="shot">Render PNG</button>
  <div class="hint"><kbd>←</kbd><kbd>→</kbd> aset · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> LOD · <kbd>W</kbd> wire · <kbd>C</kbd> collision · <kbd>T</kbd> putar · <kbd>P</kbd> tour · <kbd>F</kbd> layar penuh</div>
</div>

<div id="stats" class="panel">
  <p class="name" id="sName"></p>
  <p class="cat" id="sCat"></p>
  <code id="sId"></code>
  <p class="desc" id="sDesc"></p>
  <div class="grid4">
    <div><b id="sTri">0</b><span>Triangles</span></div>
    <div><b id="sMesh">0</b><span>Mesh</span></div>
    <div><b id="sMat">0</b><span>Material</span></div>
    <div><b id="sCol">0</b><span>Collider</span></div>
  </div>
  <div id="sLod"></div>
</div>

<div id="bar" class="panel">
  <button id="prev" title="Aset sebelumnya">◀</button>
  <button id="tour" title="Auto-tour (P)">▶ Auto-tour</button>
  <button id="next" title="Aset berikutnya">▶</button>
  <button id="full" title="Layar penuh (F)">⛶</button>
  <span class="sep t"></span>
  <span class="tier">Basic <b>$15</b></span><span class="tier">Pro <b>$25</b></span><span class="tier">Studio <b>$40</b></span>
</div>
<div id="tourbar"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const V3 = THREE.Vector3, PI = Math.PI;

// ======================================================================
// state, palettes, materials
// ======================================================================
const state = { asset:'lapak', lod:0, variant:'jati', mode:'shaded', collision:false, turntable:true, filter:'all', tour:false };

const VARIANTS = {
  jati:  { name:'Kayu Jati', wood:0x9b6b43, woodDark:0x5e3d24, roof:0xa9472c, cloth1:0xd99a2b, cloth2:0xf1e2c0, clay:0xb5603a, metal:0x9aa4ad, accent:0x1f7a5c, sack:0xd9c59b, rope:0xb08550, stone:0x9b9488, stone2:0x857e73 },
  bambu: { name:'Bambu',     wood:0xc9a95c, woodDark:0x8a6d32, roof:0x5f5136, cloth1:0x3f8f6b, cloth2:0xe9e1c6, clay:0xa8764f, metal:0x7f8a80, accent:0xc0392b, sack:0xcbbf98, rope:0xbfa064, stone:0x8f9a86, stone2:0x7b8673 },
  warna: { name:'Cat Warna', wood:0x2f8f9d, woodDark:0x1f5f6a, roof:0xd2452f, cloth1:0xe94f64, cloth2:0xfff0d1, clay:0xc8693f, metal:0xb7bcc4, accent:0x7438b0, sack:0xe0cfa6, rope:0xc19a5b, stone:0xa49a8c, stone2:0x8d8476 },
};
const FIXED = {
  fOrange:0xe8862a, fRed:0xc8323b, fGreen:0x6fa83a, fYellow:0xe8c547,
  skin:0xc68a5c, hair:0x2a1d17, dark:0x1b1420, leaf:0x5d9d3a, leafDry:0xa99a4a, trunk:0x8b8f4f, jantung:0x7a2d4a,
  gold:0xd4a640, blade:0x8a909b, bamboo:0xa7b04e, soil:0x6b4a32, grass:0x6d9a45, coco:0x7a5a2e,
};
const METALS = new Set(['metal','gold','blade']);

const matCache = {};
function M(key){
  const k = state.variant + ':' + key;
  if (matCache[k]) return matCache[k];
  const ds = key.endsWith('DS'), base = ds ? key.slice(0,-2) : key;
  const color = VARIANTS[state.variant][base] ?? FIXED[base];
  const metal = METALS.has(base);
  return matCache[k] = new THREE.MeshStandardMaterial({
    color, flatShading:true, roughness: metal ? .45 : .85, metalness: metal ? .3 : 0,
    side: ds ? THREE.DoubleSide : THREE.FrontSide
  });
}
const glassMat  = new THREE.MeshStandardMaterial({ color:0xfff1c9, emissive:0xffb648, emissiveIntensity:1.3, transparent:true, opacity:.72, side:THREE.DoubleSide });
const clearMat  = new THREE.MeshStandardMaterial({ color:0xe2f3ff, transparent:true, opacity:.45, roughness:.1 });
const mantleMat = new THREE.MeshBasicMaterial({ color:0xfff4d6 });
const flameMat  = new THREE.MeshBasicMaterial({ color:0xff7a1a });
const flameCore = new THREE.MeshBasicMaterial({ color:0xffe27a });
const clayMat   = new THREE.MeshStandardMaterial({ color:0xd9d4cc, flatShading:true, roughness:1 });
const wireMat   = new THREE.LineBasicMaterial({ color:0x150a22, transparent:true, opacity:.6 });
const colMat    = new THREE.MeshBasicMaterial({ color:0x37e39a, transparent:true, opacity:.16, depthWrite:false });
const colLine   = new THREE.LineBasicMaterial({ color:0x37e39a });

// ======================================================================
// procedural PBR textures
// ======================================================================
const hex = n => '#' + n.toString(16).padStart(6,'0');
const shade = (n,f) => `rgb(${[16,8,0].map(s => Math.min(255, Math.round(((n>>s)&255)*f))).join(',')})`;
function rng(seed){ return () => ((seed = (seed*16807) % 2147483647) - 1) / 2147483646; }

const texCache = {};
function canvasTex(kind){
  const k = state.variant + ':' + kind;
  if (texCache[k]) return texCache[k];
  const P = VARIANTS[state.variant], c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d'), r = rng(kind.length*7919 + kind.charCodeAt(0));
  switch (kind){
    case 'kayu':
      for (let i=0;i<4;i++){
        const y0 = i*64;
        x.fillStyle = shade(P.wood, .88 + r()*.24); x.fillRect(0,y0,256,64);
        for (let l=0;l<14;l++){
          x.strokeStyle = `rgba(0,0,0,${.06+r()*.1})`; x.lineWidth = 1+r()*1.5; x.beginPath();
          const yy = y0 + 4 + r()*56, a = r()*3;
          for (let px=0;px<=256;px+=8) x.lineTo(px, yy + Math.sin(px/30+a)*2.5);
          x.stroke();
        }
        x.fillStyle = shade(P.woodDark,.8); x.fillRect(0,y0,256,3); x.fillRect((i*97)%256,y0,3,64);
      }
      break;
    case 'bata':
      x.fillStyle = shade(P.stone,1.15); x.fillRect(0,0,256,256);
      for (let row=0;row<8;row++) for (let col=-1;col<5;col++){
        x.fillStyle = shade(P.clay, .82 + r()*.3);
        x.fillRect(col*64+(row%2?32:0)+3, row*32+3, 58, 26);
      }
      break;
    case 'batik':
      x.fillStyle = hex(P.cloth2); x.fillRect(0,0,256,256);
      for (let i=0;i<5;i++) for (let j=0;j<5;j++){
        const cx = i*64, cy = j*64;
        for (let q=0;q<4;q++){
          x.save(); x.translate(cx,cy); x.rotate(PI/4 + q*PI/2);
          x.beginPath(); x.ellipse(0,-17,10,16,0,0,PI*2);
          x.fillStyle = hex(P.cloth1); x.fill(); x.lineWidth = 3; x.strokeStyle = hex(P.woodDark); x.stroke();
          x.beginPath(); x.ellipse(0,-17,3,6,0,0,PI*2); x.fillStyle = hex(P.woodDark); x.fill();
          x.restore();
        }
        x.beginPath(); x.arc(cx+32,cy+32,4,0,PI*2); x.fillStyle = hex(P.woodDark); x.fill();
      }
      break;
    case 'anyaman':
      x.fillStyle = shade(P.woodDark,.7); x.fillRect(0,0,256,256);
      for (let i=0;i<8;i++) for (let j=0;j<8;j++){
        x.fillStyle = shade(P.rope, .85 + r()*.25);
        if ((i+j)%2) x.fillRect(i*32+2, j*32+6, 28, 20); else x.fillRect(i*32+6, j*32+2, 20, 28);
      }
      break;
    case 'genteng':
      x.fillStyle = shade(P.roof,.55); x.fillRect(0,0,256,256);
      for (let row=-1;row<9;row++) for (let col=-1;col<9;col++){
        const cx = col*32+(row%2?16:0)+16, cy = row*32+8;
        const g = x.createLinearGradient(cx-14,0,cx+14,0);
        g.addColorStop(0, shade(P.roof,.7)); g.addColorStop(.5, shade(P.roof,1.15)); g.addColorStop(1, shade(P.roof,.7));
        x.fillStyle = g; x.beginPath(); x.roundRect(cx-14, cy, 28, 34, [3,3,14,14]); x.fill();
      }
      break;
    case 'batu':
      x.fillStyle = shade(P.stone2,.6); x.fillRect(0,0,256,256);
      for (let i=0;i<5;i++) for (let j=0;j<5;j++){
        x.fillStyle = shade(P.stone, .8 + r()*.35);
        x.beginPath(); x.roundRect(i*52 + 2 + r()*4, j*52 + 2 + r()*4, 44 + r()*10, 44 + r()*10, 9); x.fill();
      }
      break;
    case 'bambu': {
      const B = FIXED.bamboo;
      for (let i=0;i<9;i++){
        const x0 = i*28.5, g = x.createLinearGradient(x0,0,x0+28,0);
        g.addColorStop(0, shade(B,.6)); g.addColorStop(.5, shade(B,1.15)); g.addColorStop(1, shade(B,.6));
        x.fillStyle = g; x.fillRect(x0,0,29,256);
        x.fillStyle = shade(B,.45); const ny = r()*128; x.fillRect(x0,ny,29,4); x.fillRect(x0,ny+128,29,4);
      }
      break;
    }
    case 'kapur':
      x.fillStyle = '#e8e1d2'; x.fillRect(0,0,256,256);
      for (let i=0;i<900;i++){ x.fillStyle = `rgba(${r()<.5?'60,45,30':'255,255,255'},${r()*.09})`; x.fillRect(r()*256, r()*256, 2+r()*5, 2+r()*5); }
      x.strokeStyle = 'rgba(70,55,40,.35)'; x.lineWidth = 1.2;
      for (let k=0;k<5;k++){ let px = r()*256, py = r()*256; x.beginPath(); x.moveTo(px,py); for (let s=0;s<9;s++){ px += (r()-.5)*28; py += r()*16; x.lineTo(px,py); } x.stroke(); }
      break;
    case 'tanah':
      x.fillStyle = hex(FIXED.soil); x.fillRect(0,0,256,256);
      for (let i=0;i<140;i++){ x.globalAlpha = .45; x.fillStyle = shade(FIXED.soil, .7 + r()*.6); x.beginPath(); x.arc(r()*256, r()*256, 4 + r()*16, 0, PI*2); x.fill(); }
      x.globalAlpha = 1;
      for (let i=0;i<70;i++){ x.fillStyle = shade(P.stone, .75 + r()*.45); x.beginPath(); x.ellipse(r()*256, r()*256, 2+r()*4, 2+r()*3, r()*3, 0, PI*2); x.fill(); }
      break;
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  return texCache[k] = t;
}
function texMat(kind){
  const k = state.variant + ':tex:' + kind;
  if (matCache[k]) return matCache[k];
  const t = canvasTex(kind);
  return matCache[k] = new THREE.MeshStandardMaterial({ map:t, bumpMap:t, bumpScale:1.5, roughness: kind==='genteng' ? .55 : .85 });
}
function label(text, w=.85){
  const c = document.createElement('canvas'); c.width = 512; c.height = 96;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(30,15,50,.88)'; x.strokeStyle = '#fbb01c'; x.lineWidth = 4;
  x.beginPath(); x.roundRect(4,4,504,88,44); x.fill(); x.stroke();
  x.fillStyle = '#fff'; x.font = 'bold 38px system-ui,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, 256, 50);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:t, depthWrite:false }));
  s.scale.set(w, w*.19, 1); return s;
}

// ======================================================================
// geometry helpers
// ======================================================================
let curLod = 0;
const S = (n, min=3) => Math.max(min, Math.round(n * [1,.55,.3][curLod]));
const D = l => curLod <= l;   // this detail exists up to LOD l

function mk(geo, mat, parent, x=0, y=0, z=0){
  const m = new THREE.Mesh(geo, typeof mat === 'string' ? M(mat) : mat);
  m.position.set(x,y,z); parent && parent.add(m); return m;
}
const box = (g,mat,w,h,d,x,y,z) => mk(new THREE.BoxGeometry(w,h,d), mat, g, x,y,z);
function rod(g, a, b, r, mat, seg=4){
  const d = new V3().subVectors(b,a), len = d.length();
  const m = mk(new THREE.CylinderGeometry(r,r,len,seg), mat, g);
  m.position.copy(a).addScaledVector(d,.5);
  m.quaternion.setFromUnitVectors(new V3(0,1,0), d.normalize());
  return m;
}
const ring = (g,mat,r,t,y,x=0,z=0) => { const m = mk(new THREE.TorusGeometry(r,t,3,S(16,6)), mat, g, x,y,z); m.rotation.x = PI/2; return m; };
function col(g, geo, x, y, z, rx=0, ry=0, rz=0){
  const m = new THREE.Mesh(geo, colMat);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.userData.collider = true; m.renderOrder = 10;
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), colLine));
  g.add(m); return m;
}
const colBox = (g,w,h,d,x,y,z,ry=0) => col(g, new THREE.BoxGeometry(w,h,d), x,y,z,0,ry);
const colCyl = (g,r,h,x,y,z,rx=0,rz=0) => col(g, new THREE.CylinderGeometry(r,r,h,12), x,y,z,rx,0,rz);
const lathe = (pts, seg) => new THREE.LatheGeometry(pts.map(([x,y]) => new THREE.Vector2(x,y)), seg);
function extrude(pts, depth, bevel=.003, curve=8){
  const s = new THREE.Shape();
  pts.forEach(([x,y],i) => i ? s.lineTo(x,y) : s.moveTo(x,y));
  const geo = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled:bevel>0, bevelThickness:bevel, bevelSize:bevel*.7, bevelSegments:1, curveSegments:curve });
  geo.translate(0,0,-depth/2); return geo;
}
// gable roof, ridge along z. width = span across x
function gable(g, mat, width, len, h, y, over=.25){
  const half = width/2 + over, slope = Math.hypot(half,h), ang = Math.atan2(h,half);
  for (const s of [-1,1]){
    const m = box(g, mat, slope, .07, len + over*2, s*half/2, y + h/2, 0);
    m.rotation.z = -s*ang;
  }
}
function prism(width, h, len){
  const geo = extrude([[-width/2,0],[width/2,0],[0,h]], len, 0); return geo;
}
function wheel(r, n=6, tube=.03){
  const w = new THREE.Group();
  mk(new THREE.TorusGeometry(r,tube,S(6),S(24,8)), 'dark', w);
  mk(new THREE.CylinderGeometry(r*.14,r*.14,.06,S(10,5)), 'metal', w).rotation.x = PI/2;
  const k = [n, Math.ceil(n*.67), Math.ceil(n/2)][curLod];
  for (let i=0;i<k;i++) mk(new THREE.BoxGeometry(.012,r*2,.012), 'metal', w).rotation.z = i*PI/k;
  return w;
}
// deterministic lumpy deformation for rocks/bushes
function lumpy(geo, amt, seed=1){
  const p = geo.attributes.position, v = new V3();
  for (let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    const n = 1 + amt*(Math.sin(v.x*7.1+seed)*Math.cos(v.z*6.3-seed) + Math.sin(v.y*8.7+seed*2)*.6);
    p.setXYZ(i, v.x*n, v.y*n, v.z*n);
  }
  geo.computeVertexNormals(); return geo;
}

function buildKeris(withCol=true){

  mk(lathe([[0,0],[.022,0],[.027,.03],[.02,.06],[.029,.09],[.017,.115],[0,.12]], S(12,5)), 'woodDark', g, kx,.1,0);

  box(g,'blade',.11,.016,.016,kx+.015,.236,0);
  const L = .46, n = S(56,14), right = [], left = [];

    const c = .012*Math.sin(t*PI*7)*(1-t*.8);

      if (D(1) && m === 'clay' && h > .45) box(g,'stone2',w*.55,h*.55,.03, s*(gap/2+w/2), y+h/2, d/2+.01);

}

function fenceSeg(len=2){

function buildPagar(withCol=true){

function roadTile(type){
  const g = new THREE.Group();
  box(g,'grass',2,.1,2,0,.05,0);
  const path = (w,d,x,z,lift=0) => { const m = mk(new THREE.BoxGeometry(w,.03,d), texMat('batu'), g, x,.115+lift,z); return m; };
  if (type==='lurus') path(2,1,0,0);
  if (type==='belok'){ path(1.5,1,-.25,0); path(1,1.5,0,.25,.001); }
  if (type==='tiga'){ path(2,1,0,0); path(1,1,0,.75,.001); }
  if (type==='empat'){ path(2,1,0,0); path(1,2,0,0,.001); }
  if (D(1)){
    const curb = (w,d,x,z) => box(g,'cloth2',w,.06,d,x,.13,z);
    if (type==='lurus'){ curb(2,.06,0,.53); curb(2,.06,0,-.53); }
    if (type==='belok'){ curb(1.5,.06,-.25,-.53); curb(.06,1.5,.53,.25); curb(.47,.06,-.765,.53); curb(.06,.47,-.53,.765); }
    if (type==='tiga'){ curb(2,.06,0,-.53); for (const s of [-1,1]){ curb(.47,.06,s*.765,.53); curb(.06,.47,s*.53,.765); } }
    if (type==='empat') for (const sx of [-1,1]) for (const sz of [-1,1]){ curb(.47,.06,sx*.765,sz*.53); curb(.06,.47,sx*.53,sz*.765); }
  }
  if (D(0)) for (let i=0;i<4;i++){ const a = i*1.7; mk(new THREE.IcosahedronGeometry(.08,0), 'leaf', g, Math.cos(a)*.8, .14, Math.sin(a)*.8).scale.y = .6; }
  return g;
}
function buildJalan(withCol=true){
  const g = new THREE.Group();
  [['lurus','Lurus'],['belok','Belokan'],['tiga','Pertigaan'],['empat','Perempatan']].forEach(([t,name],i) => {
    const x = (i-1.5)*2.3, tile = roadTile(t); tile.position.x = x; g.add(tile);
    const l = label(name,.9); l.position.set(x,.6,0); g.add(l);
    if (withCol) colBox(g,2,.13,2,x,.065,0);
  });
  return g;
}

function leafGeo(len, width=.34, droop=.5){
  const geo = new THREE.PlaneGeometry(width, len, 2, S(8,3));
  const p = geo.attributes.position;
  for (let i=0;i<p.count;i++){
    const x = p.getX(i), t = (p.getY(i) + len/2) / len;
    const xx = x * Math.pow(Math.sin(PI*Math.min(t,.96)), .55);
    p.setXYZ(i, xx, t*len, t*t*len*droop + Math.abs(xx)*.3);
  }
  geo.computeVertexNormals();
  return geo;
}
function buildBanana(withCol=true){
  const g = new THREE.Group();
  mk(new THREE.CylinderGeometry(.08,.13,1.4,S(10,5),2), 'trunk', g, 0,.7,0);
  if (D(0)) for (const y of [.35,.75,1.1]) ring(g,'leafDry',.12-y*.03,.012,y);
  const n = [8,6,4][curLod];
  for (let i=0;i<n;i++){
    const h = new THREE.Group(); h.position.y = 1.32; h.rotation.y = i/n*PI*2 + (i%2)*.3; g.add(h);
    const dry = D(0) && i === n-1;
    mk(leafGeo(1.05 + (i%3)*.12), dry ? 'leafDryDS' : 'leafDS', h).rotation.x = dry ? 1.9 : .35 + (i%3)*.28;
  }
  if (D(0)) mk(new THREE.ConeGeometry(.04,.5,6), 'leaf', g, 0,1.6,0);
  if (D(1)){
    const c = new V3(.24,1.0,.08);
    rod(g, new V3(.04,1.3,.02), c.clone().add(new V3(0,.08,0)), .018, 'trunk', 5);
    const rings = D(0) ? 3 : 2, per = D(0) ? 6 : 5;
    for (let r=0;r<rings;r++) for (let k=0;k<per;k++){
      const a = k/per*PI*2 + r*.4;
      mk(new THREE.CylinderGeometry(.016,.022,.12,4), 'fGreen', g, c.x+Math.cos(a)*.06, c.y-r*.07, c.z+Math.sin(a)*.06).rotation.set(Math.sin(a)*.5, 0, -Math.cos(a)*.5);
    }
    if (D(0)){ rod(g, c, new V3(.26,.72,.1), .01, 'trunk', 4); mk(new THREE.ConeGeometry(.045,.14,7), 'jantung', g, .26,.66,.1).rotation.x = PI; }
  }
  if (withCol) colCyl(g,.13,1.4,0,.7,0);
  return g;
}

function buildKelapa(withCol=true){
  const g = new THREE.Group();
  const P = t => new V3(.7*t*t, 4*t, .15*t);
  const n = S(8,4);
  for (let i=0;i<n;i++){
    const a = P(i/n), b = P((i+1)/n), r = .15 - .05*(i/n);
    const m = rod(g, a, b, r, 'trunk', S(8,5));
    if (D(0)) ring(g,'leafDry',r+.01,.012,a.y, a.x, a.z).quaternion.copy(m.quaternion).multiply(new THREE.Quaternion().setFromAxisAngle(new V3(1,0,0),PI/2));
  }
  const top = P(1);
  const fronds = [12,9,6][curLod];
  for (let i=0;i<fronds;i++){
    const h = new THREE.Group(); h.position.copy(top); h.rotation.y = i/fronds*PI*2; g.add(h);
    mk(leafGeo(1.9, .5, .9), (D(0) && i%5===4) ? 'leafDryDS' : 'leafDS', h).rotation.x = .6 + (i%3)*.25;
  }
  for (let i=0;i<[5,4,3][curLod];i++){ const a = i/5*PI*2; mk(new THREE.SphereGeometry(.11,S(8,4),S(6,3)), 'coco', g, top.x+Math.cos(a)*.15, top.y-.15, top.z+Math.sin(a)*.15); }
  if (withCol) colCyl(g,.18,4,.25,2,0);
  return g;
}

function buildBambuClump(withCol=true){
  const g = new THREE.Group();
  mk(new THREE.SphereGeometry(.6,S(12,5),S(6,3),0,PI*2,0,PI/2), 'soil', g).scale.y = .25;
  const n = [10,7,4][curLod], r = rng(42);
  for (let i=0;i<n;i++){
    const a = i/n*PI*2 + r(), d = .12 + r()*.3, h = 3 + r()*1.6;
    const base = new V3(Math.cos(a)*d, .05, Math.sin(a)*d);
    const tip = new V3(Math.cos(a)*(d+.5+r()*.5), h, Math.sin(a)*(d+.5+r()*.5));
    rod(g, base, tip, .035 + r()*.015, 'bamboo', S(7,4));
    if (D(0)) for (let k=1;k<6;k++){ const p = base.clone().lerp(tip, k/6); mk(new THREE.SphereGeometry(.045,5,3), 'trunk', g, p.x,p.y,p.z).scale.y = .3; }
    if (D(1)) for (let k=0;k<4;k++){
      const p = base.clone().lerp(tip, .62 + k*.1), lf = new THREE.Group(); lf.position.copy(p); lf.rotation.y = r()*PI*2; g.add(lf);
      mk(leafGeo(.45,.1,.3), 'leafDS', lf).rotation.x = 1.2;
    }
  }
  if (withCol) colCyl(g,.6,4,0,2,0);
  return g;
}

function buildRocks(withCol=true){
  const g = new THREE.Group();
  const det = D(0) ? 1 : 0;
  [[0,0,.55,1],[.75,.2,.35,2],[-.6,.35,.3,3],[.3,-.6,.25,4]].forEach(([x,z,s,seed]) => {
    const m = mk(lumpy(new THREE.IcosahedronGeometry(s, det), .12, seed), 'stone', g, x, s*.55, z);
    m.scale.y = .7;
  });
  [[-.9,-.5],[1.1,-.4],[-.1,.95]].forEach(([x,z],i) => {
    for (let k=0;k<(D(1)?3:1);k++) mk(lumpy(new THREE.IcosahedronGeometry(.3-k*.05, det), .1, i+k), 'leaf', g, x+k*.18-.15, .22+k*.08, z+(k%2)*.12);
    if (D(0)) for (let k=0;k<4;k++) mk(new THREE.SphereGeometry(.03,5,3), 'fRed', g, x-.2+k*.13, .48+(k%2)*.06, z+.15);
  });
  if (D(0)) for (let i=0;i<10;i++){ const a = i*2.4; mk(new THREE.ConeGeometry(.025,.18,3), 'grass', g, Math.cos(a)*(.9+i*.03), .09, Math.sin(a)*(.9+i*.03)); }
  if (withCol){ col(g, new THREE.SphereGeometry(.6,8,6), 0,.35,0); colBox(g,.7,.45,.7,.75,.22,.2); }
  return g;
}

               desc:'Lampu petromaks dengan kaca emissive dan titik cahaya bawaan.' },
  obor:      { g:'props', ico:'🔥', id:'SM_AFS_OborBambu', name:'Obor Bambu', cat:'Props · Lighting', build:buildObor,
               desc:'Obor bambu dengan api beranimasi dan point light bawaan.' },
  karung:    { g:'props', ico:'🌾', id:'SM_AFS_KarungBeras', name:'Karung Beras', cat:'Props', build:buildSack,
               desc:'Karung goni dengan bentuk organik dan label. Bisa ditumpuk.' },
  lesung:    { g:'props', ico:'🪵', id:'SM_AFS_LesungAlu', name:'Lesung & Alu', cat:'Props', build:buildLesung,
               desc:'Lesung kayu panjang dengan dua lubang berisi padi dan sepasang alu.' },
  tampah:    { g:'props', ico:'🥕', id:'SM_AFS_TampahSayur', name:'Tampah Sayur', cat:'Props', build:buildTampah,
               desc:'Tampah anyaman di atas bangku, berisi tomat, wortel, terong, dan kol.' },
  warung:    { g:'props', ico:'☕', id:'SM_AFS_WarungKopi', name:'Meja & Lincak', cat:'Props · Furnitur', build:buildWarung,
               desc:'Meja warung dan dua bangku lincak bambu, lengkap dengan teko, gelas, dan gorengan.' },
  gong:      { g:'props', ico:'🥁', id:'SM_AFS_Gong',      name:'Gong Gamelan', cat:'Props · Musik', build:buildGong,
               desc:'Gong perunggu tergantung di rancakan kayu berukir, lengkap dengan pemukulnya.' },
  bedug:     { g:'props', ico:'🪘', id:'SM_AFS_Bedug',     name:'Bedug', cat:'Props · Musik', build:buildBedug,
               desc:'Bedug besar di atas penyangga kayu, dengan pasak kulit dan pemukul.' },
  angklung:  { g:'props', ico:'🎶', id:'SM_AFS_Angklung',  name:'Angklung (Set 3)', cat:'Props · Musik', build:buildAngklung,
               desc:'Tiga angklung bambu dengan ukuran berbeda.' },
  // Texture Pack
  tekstur:   { g:'tex', ico:'🎨', id:'T_AFS_NusantaraPBR', name:'Material Nusantara', cat:'Texture Pack · PBR', build:buildTexPack,
               desc:'9 material siap pakai: kayu, bata, batik kawung, anyaman, genteng, paving, bambu, tembok kapur, dan tanah.' },
};
const GROUPS = [['env','Environment Kit'],['char','Karakter'],['weapon','Senjata'],['vehicle','Kendaraan'],['props','Props'],['tex','Texture Pack']];
const KEYS = GROUPS.flatMap(([gk]) => Object.keys(ASSETS).filter(k => ASSETS[k].g === gk));

// ======================================================================
// renderer / scene
// ======================================================================
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, .02, 300);
camera.position.set(5,3,6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = .2; controls.maxDistance = 60; controls.maxPolarAngle = PI*.49;

scene.add(new THREE.HemisphereLight(0xfff1dc, 0x3a2455, 1.3));
const sun = new THREE.DirectionalLight(0xffe2b8, 2.4);
sun.castShadow = true; sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias = -.0005; sun.shadow.normalBias = .02;
scene.add(sun, sun.target);
const rim = new THREE.DirectionalLight(0xc6a3ff, 1.0); rim.position.set(-5,3,-4); scene.add(rim);

const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(120,120), new THREE.ShadowMaterial({ opacity:.3 }));
shadowPlane.rotation.x = -PI/2; shadowPlane.position.y = -.1; shadowPlane.receiveShadow = true; scene.add(shadowPlane);
const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(1,1.04,.1,64), new THREE.MeshStandardMaterial({ color:0x3b2160, roughness:.9 }));
pedestal.position.y = -.05; pedestal.receiveShadow = true; scene.add(pedestal);
const pedRing = new THREE.Mesh(new THREE.TorusGeometry(1.04,.012,4,96), new THREE.MeshBasicMaterial({ color:0xfbb01c }));
pedRing.rotation.x = PI/2; pedestal.add(pedRing);

// ======================================================================
// build / swap
// ======================================================================
let asset = null, lodTris = [0,0,0], flames = [];

function countTris(g){
  let t = 0;
  g.traverse(o => { if (o.isMesh && !o.userData.collider){ const geo=o.geometry; t += (geo.index ? geo.index.count : geo.attributes.position.count)/3; } });
  return Math.round(t);
}
function disposeTree(g){
  g.traverse(o => {
    if (o.isSprite){ o.material.map.dispose(); o.material.dispose(); }
    else if (o.geometry) o.geometry.dispose();
  });
}
function make(key, lod, decorate=true){
  curLod = lod;
  const g = ASSETS[key].build();
  if (!decorate) return g;
  const meshes = [];
  g.traverse(o => { if (o.isMesh && !o.userData.collider) meshes.push(o); });
  for (const m of meshes){
    m.castShadow = !m.userData.noShadow; m.receiveShadow = true;
    m.userData.orig = m.material;
    const l = new THREE.LineSegments(new THREE.WireframeGeometry(m.geometry), wireMat);
    l.userData.wire = true; l.visible = false; m.add(l);
  }
  return g;
}
function applyView(){
  if (!asset) return;
  asset.traverse(o => {
    if (o.userData.collider) o.visible = state.collision;
    else if (o.userData.wire) o.visible = state.mode === 'wire';
    else if (o.isMesh && o.userData.orig) o.material = state.mode === 'clay' ? clayMat : o.userData.orig;
  });
}
function rebuild(reframe){
  const rot = asset ? asset.rotation.y : 0;
  if (asset){ scene.remove(asset); disposeTree(asset); }
  asset = make(state.asset, state.lod);
  asset.rotation.y = reframe ? 0 : rot;
  scene.add(asset);
  flames = []; asset.traverse(o => { if (o.userData.flame) flames.push(o); });
  applyView();
  if (reframe) frame();
  updateStats();
}

let tween = null;
function frame(){
  const b = new THREE.Box3().setFromObject(asset);
  const c = b.getCenter(new V3()), s = b.getSize(new V3());
  const isDemo = state.asset === 'demo';
  pedestal.visible = !isDemo;
  const R = Math.max(s.x, s.z) * .78;
  pedestal.scale.set(R,1,R);
  // shadow camera follows asset size
  const ext = Math.max(s.x, s.y, s.z) * .85 + .5;
  Object.assign(sun.shadow.camera, { left:-ext, right:ext, top:ext, bottom:-ext, near:.1, far:ext*6 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.position.copy(c).add(new V3(4,7,3).normalize().multiplyScalar(ext*2.5));
  sun.target.position.copy(c);
  let dist = (s.length()/2) / Math.sin(THREE.MathUtils.degToRad(camera.fov/2)) * (isDemo ? .72 : .95);
  if (camera.aspect < 1) dist /= Math.max(.55, camera.aspect);
  const to = c.clone().addScaledVector(new V3(1,.62,1.3).normalize(), dist);
  tween = { fp:camera.position.clone(), tp:to, ft:controls.target.clone(), tt:c, t:0 };
}
controls.addEventListener('start', () => { tween = null; });

// ======================================================================
// UI
// ======================================================================
const $ = id => document.getElementById(id);
$('count').textContent = `${KEYS.length} aset · Nusantara Kit`;

function updateStats(){
  const a = ASSETS[state.asset];
  $('sName').textContent = a.name; $('sCat').textContent = a.cat; $('sDesc').textContent = a.desc;
  $('sId').textContent = `${a.id}_LOD${state.lod}`;
  $('tName').textContent = a.name;
  $('tSub').innerHTML = `${GROUPS.find(g => g[0]===a.g)[1]} · ${a.cat} · <em>${KEYS.indexOf(state.asset)+1}/${KEYS.length}</em>`;
  let meshes=0, cols=0; const mats = new Set();
  asset.traverse(o => {
    if (!o.isMesh) return;
    if (o.userData.collider) cols++; else { meshes++; mats.add(o.userData.orig); }
  });
  $('sTri').textContent = countTris(asset).toLocaleString('id-ID');
  $('sMesh').textContent = meshes; $('sMat').textContent = mats.size; $('sCol').textContent = cols;
  const max = lodTris[0] || 1;
  $('sLod').innerHTML = lodTris.map((t,i) =>
    `<div class="lodrow ${i===state.lod?'on':''}"><span>LOD${i}</span><div class="bar"><i style="width:${t/max*100}%"></i></div><em>${t.toLocaleString('id-ID')}</em></div>`).join('');
}
function computeLodTris(){
  lodTris = [0,1,2].map(l => { const g = make(state.asset, l, false); const t = countTris(g); disposeTree(g); return t; });
}

// catalogue list + category chips
const listEl = $('list'), chipsEl = $('chips');
function renderChips(){
  chipsEl.innerHTML = '';
  for (const [k,name] of [['all','Semua'], ...GROUPS]){
    const b = document.createElement('button'); b.textContent = name; b.classList.toggle('on', state.filter === k);
    b.onclick = () => { state.filter = k; renderChips(); renderList(); };
    chipsEl.appendChild(b);
  }
}
function visibleKeys(){ return state.filter === 'all' ? KEYS : KEYS.filter(k => ASSETS[k].g === state.filter); }
function renderList(){
  listEl.innerHTML = '';
  for (const [gk,gname] of GROUPS){
    if (state.filter !== 'all' && state.filter !== gk) continue;
    const h = document.createElement('h2'); h.textContent = gname; listEl.appendChild(h);
    for (const k of KEYS.filter(k => ASSETS[k].g === gk)){
      const a = ASSETS[k], b = document.createElement('button');
      b.dataset.k = k; b.classList.toggle('on', k === state.asset);
      b.innerHTML = `<span class="ico">${a.ico}</span><span>${a.name}<span class="c">${a.cat}</span></span>`;
      b.onclick = () => selectAsset(k);
      listEl.appendChild(b);
    }
  }
}
function selectAsset(k){
  state.asset = k;
  listEl.querySelectorAll('button').forEach(b => {
    const on = b.dataset.k === k; b.classList.toggle('on', on);
    if (on) b.scrollIntoView({ block:'nearest', inline:'nearest' });
  });
  computeLodTris(); rebuild(true);
}
function step(dir){
  const keys = visibleKeys(), i = keys.indexOf(state.asset);
  selectAsset(keys[(i + dir + keys.length) % keys.length]);
}

function seg(el, items, key, after){
  el.innerHTML = '';
  for (const [v,lab] of items){
    const b = document.createElement('button'); b.textContent = lab; b.dataset.v = v;
    b.onclick = () => setSeg(el, key, v, after);
    el.appendChild(b);
  }
  sync(el, key);
}
function sync(el, key){ el.querySelectorAll('button').forEach(b => b.classList.toggle('on', String(state[key]) === b.dataset.v)); }
function setSeg(el, key, v, after){ state[key] = key==='lod' ? +v : v; sync(el, key); after(); }

seg($('mode'), [['shaded','Shaded'],['wire','Wireframe'],['clay','Clay']], 'mode', applyView);
seg($('lod'),  [['0','LOD0'],['1','LOD1'],['2','LOD2']], 'lod', () => rebuild(false));

const varEl = $('variants');
for (const [k,v] of Object.entries(VARIANTS)){
  const b = document.createElement('button'); b.dataset.v = k;
  b.innerHTML = `<div class="sw" style="background:linear-gradient(90deg,${hex(v.wood)} 0 34%,${hex(v.roof)} 34% 67%,${hex(v.cloth1)} 67%)"></div>${v.name}`;
  b.onclick = () => { state.variant = k; sync(varEl,'variant'); rebuild(false); };
  varEl.appendChild(b);
}
sync(varEl,'variant');

function toggle(id, key, after){
  const el = $(id);
  const set = v => { state[key] = v; el.classList.toggle('on', v); after && after(); };
  el.onclick = () => set(!state[key]);
  return set;
}
const setCol  = toggle('tCol','collision', applyView);
const setTurn = toggle('tTurn','turntable');

$('shot').onclick = () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.href = renderer.domElement.toDataURL('image/png');
  a.download = `${ASSETS[state.asset].id}_${state.variant}_LOD${state.lod}.png`;
  a.click();
};

// presentation: prev/next, auto-tour, fullscreen
const TOUR_MS = 7000;
let tourT = 0;
function setTour(v){
  state.tour = v; tourT = 0;
  $('tour').classList.toggle('on', v); $('tour').textContent = v ? '❚❚ Auto-tour' : '▶ Auto-tour';
  if (v) setTurn(true);
  $('tourbar').style.width = '0';
}
$('prev').onclick = () => { tourT = 0; step(-1); };
$('next').onclick = () => { tourT = 0; step(1); };
$('tour').onclick = () => setTour(!state.tour);
function toggleFull(){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
$('full').onclick = toggleFull;

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['1','2','3'].includes(k)) setSeg($('lod'),'lod',+k-1,() => rebuild(false));
  else if (k === 'arrowright'){ tourT = 0; step(1); }
  else if (k === 'arrowleft'){ tourT = 0; step(-1); }
  else if (k === 'w') setSeg($('mode'),'mode', state.mode==='wire'?'shaded':'wire', applyView);
  else if (k === 'c') setCol(!state.collision);
  else if (k === 't') setTurn(!state.turntable);
  else if (k === 'p') setTour(!state.tour);
  else if (k === 'f') toggleFull();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ======================================================================
// loop
// ======================================================================
const clock = new THREE.Clock();
const ease = t => 1 - Math.pow(1-t, 3);
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), now = clock.elapsedTime;
  if (tween){
    tween.t = Math.min(1, tween.t + dt/0.8);
    const k = ease(tween.t);
    camera.position.lerpVectors(tween.fp, tween.tp, k);
    controls.target.lerpVectors(tween.ft, tween.tt, k);
    if (tween.t >= 1) tween = null;
  }
  if (state.turntable && asset) asset.rotation.y += dt * .35;
  flames.forEach((f,i) => { f.scale.set(1 + .08*Math.sin(now*17+i), 1 + .18*Math.sin(now*11+i*2), 1 + .08*Math.cos(now*15+i)); });
  if (state.tour){
    tourT += dt*1000;
    $('tourbar').style.width = Math.min(100, tourT/TOUR_MS*100) + '%';
    if (tourT >= TOUR_MS){ tourT = 0; step(1); }
  }
  controls.update();
  renderer.render(scene, camera);
});

renderChips(); renderList();
selectAsset('lapak');
camera.position.copy(tween.tp); controls.target.copy(tween.tt); tween = null;
</script>
</body>
</html>
